<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .button:hover {
            background: #2563eb;
        }

        footer {
            margin-top: 3rem;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>

        <p>
            Thanks for visiting my GitHub Pages site.
            This space is used to showcase projects, experiments,
            and technical work.
        </p>

        <a class="button" href="https://github.com/claudioacanfora">
            View GitHub Profile
        </a>

        <footer>
			© <span id="year"></span> Claudio Acanfora
		</footer>
    </div>
</body>

<script>
    document.getElementById("year").textContent =
        new Date().getFullYear();
</script>

</html>
